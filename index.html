
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Hand Tracking</title>
  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
</head>
<body>
  <main id="cameraView">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <button id="cameraBtn" aria-label="Aktifkan kamera">
      <svg id="cameraIcon" viewBox="0 0 24 24"
           width="27" height="27" fill="none"
           stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/>
        <circle cx="12" cy="12" r="3"/>
        <path d="m16 5 2 2 4-4"/>
      </svg>
    </button>
  </main>

  <script src="script.js"></script>
</body>
</html>
